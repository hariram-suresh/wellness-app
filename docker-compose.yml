version: '3.9'

services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - ai-service
      - postgres

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wellness
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090" 

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"