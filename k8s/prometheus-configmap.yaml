apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "backend"
        static_configs:
          - targets: ["backend-service:80"]

      - job_name: "ai-service"
        static_configs:
          - targets: ["ai-service:8001"]
