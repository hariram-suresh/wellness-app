apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service
          image: wellness-app-backend:v3

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8001