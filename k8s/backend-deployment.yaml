apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: wellness-app-backend:k8sfinal2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          